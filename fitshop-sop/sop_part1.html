<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitshop Hall/Tirol – Verkaufs-SOP 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

  :root {
    --red: #e31e24;
    --red-dark: #c0191e;
    --red-light: #f8e8e8;
    --anthracite: #2d2d2d;
    --gray-dark: #3d3d3d;
    --gray-mid: #6b6b6b;
    --gray-light: #f4f4f4;
    --gray-border: #e0e0e0;
    --white: #ffffff;
    --box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', Arial, sans-serif;
    font-size: 10pt;
    color: var(--anthracite);
    background: var(--white);
    line-height: 1.55;
  }

  /* PAGE BREAKS */
  .page {
    width: 210mm;
    min-height: 297mm;
    padding: 18mm 16mm 18mm 16mm;
    margin: 0 auto;
    background: white;
    page-break-after: always;
    position: relative;
  }
  .page:last-child { page-break-after: avoid; }

  @page {
    size: A4;
    margin: 0;
  }
  @media print {
    body { margin: 0; }
    .page { margin: 0; page-break-after: always; }
  }

  /* COVER PAGE */
  .cover {
    background: var(--anthracite);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 297mm;
    padding: 22mm 18mm 18mm 18mm;
  }
  .cover-logo-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 0;
  }
  .cover-logo-text {
    font-size: 26pt;
    font-weight: 900;
    color: var(--red);
    letter-spacing: -1px;
    text-transform: uppercase;
  }
  .cover-logo-sub {
    font-size: 9pt;
    color: #aaa;
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .cover-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 20mm 0 10mm 0;
  }
  .cover-eyebrow {
    font-size: 8pt;
    font-weight: 600;
    color: var(--red);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .cover-title {
    font-size: 28pt;
    font-weight: 800;
    color: white;
    line-height: 1.15;
    margin-bottom: 10px;
  }
  .cover-title span { color: var(--red); }
  .cover-subtitle {
    font-size: 13pt;
    color: #ccc;
    font-weight: 300;
    margin-bottom: 28px;
    line-height: 1.4;
  }
  .cover-divider {
    width: 60px;
    height: 4px;
    background: var(--red);
    margin-bottom: 24px;
  }
  .cover-tagline {
    font-size: 11pt;
    color: #bbb;
    font-style: italic;
    line-height: 1.5;
    max-width: 340px;
    border-left: 3px solid var(--red);
    padding-left: 14px;
  }
  .cover-meta-bar {
    display: flex;
    gap: 24px;
    align-items: flex-end;
    border-top: 1px solid #444;
    padding-top: 16px;
  }
  .cover-meta-item { color: #888; font-size: 8pt; line-height: 1.6; }
  .cover-meta-item strong { color: #ccc; display: block; font-size: 9pt; }
  .cover-badge {
    margin-left: auto;
    background: var(--red);
    color: white;
    font-size: 7.5pt;
    font-weight: 700;
    padding: 6px 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }

  /* TOC PAGE */
  .toc-title {
    font-size: 20pt;
    font-weight: 800;
    color: var(--anthracite);
    margin-bottom: 6px;
  }
  .toc-divider {
    width: 50px;
    height: 3px;
    background: var(--red);
    margin-bottom: 24px;
  }
  .toc-section {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 10px 0;
    border-bottom: 1px solid var(--gray-border);
  }
  .toc-num {
    min-width: 32px;
    height: 32px;
    background: var(--red);
    color: white;
    font-weight: 800;
    font-size: 9pt;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .toc-content { flex: 1; }
  .toc-label { font-size: 9pt; font-weight: 700; color: var(--anthracite); }
  .toc-desc { font-size: 8pt; color: var(--gray-mid); margin-top: 1px; }
  .toc-dots { flex: 1; border-bottom: 1px dotted #ccc; margin: 0 8px; align-self: flex-end; margin-bottom: 4px; }
  .toc-page { font-size: 8pt; color: var(--gray-mid); align-self: flex-end; margin-bottom: 4px; }

  /* PAGE HEADER */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid var(--red);
    padding-bottom: 8px;
    margin-bottom: 18px;
  }
  .page-header-left { display: flex; align-items: center; gap: 10px; }
  .page-header-logo { font-size: 13pt; font-weight: 900; color: var(--red); text-transform: uppercase; letter-spacing: -0.5px; }
  .page-header-title { font-size: 8pt; color: var(--gray-mid); font-weight: 500; }
  .page-header-section { font-size: 7.5pt; color: var(--gray-mid); text-align: right; }

  /* SECTION TITLES */
  .section-eyebrow {
    font-size: 7pt;
    font-weight: 700;
    color: var(--red);
    letter-spacing: 2.5px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .section-title {
    font-size: 16pt;
    font-weight: 800;
    color: var(--anthracite);
    margin-bottom: 4px;
    line-height: 1.2;
  }
  .section-subtitle {
    font-size: 10pt;
    color: var(--gray-mid);
    margin-bottom: 14px;
    font-weight: 400;
  }
  .section-divider {
    width: 40px;
    height: 3px;
    background: var(--red);
    margin-bottom: 16px;
  }

  /* SUBSECTION */
  .subsection-title {
    font-size: 11.5pt;
    font-weight: 700;
    color: var(--anthracite);
    margin-top: 16px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .subsection-title::before {
    content: '';
    display: inline-block;
    width: 4px;
    height: 14px;
    background: var(--red);
    flex-shrink: 0;
  }

  h3 { font-size: 10pt; font-weight: 700; color: var(--anthracite); margin: 10px 0 4px 0; }
  h4 { font-size: 9.5pt; font-weight: 600; color: var(--gray-dark); margin: 8px 0 3px 0; }
  p { margin-bottom: 7px; font-size: 9.5pt; }
  ul, ol { padding-left: 18px; margin-bottom: 8px; }
  li { font-size: 9.5pt; margin-bottom: 3px; }

  /* BOXES */
  .box {
    background: var(--gray-light);
    border-left: 4px solid var(--red);
    padding: 12px 14px;
    margin: 12px 0;
    border-radius: 0 4px 4px 0;
  }
  .box-title { font-size: 8pt; font-weight: 700; color: var(--red); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
  .box p { margin-bottom: 4px; }

  .box-dark {
    background: var(--anthracite);
    color: white;
    border-left: 4px solid var(--red);
    padding: 12px 14px;
    margin: 12px 0;
    border-radius: 0 4px 4px 0;
  }
  .box-dark .box-title { color: var(--red); }
  .box-dark p { color: #ddd; margin-bottom: 4px; }

  .box-red {
    background: var(--red-light);
    border: 1px solid #f0c0c0;
    border-left: 4px solid var(--red);
    padding: 12px 14px;
    margin: 12px 0;
    border-radius: 0 4px 4px 0;
  }
  .box-red .box-title { color: var(--red-dark); }

  .highlight-box {
    background: var(--anthracite);
    color: white;
    padding: 16px 18px;
    margin: 16px 0;
    text-align: center;
  }
  .highlight-box .quote {
    font-size: 12pt;
    font-weight: 600;
    color: white;
    font-style: italic;
    line-height: 1.4;
  }
  .highlight-box .quote-author {
    font-size: 8pt;
    color: var(--red);
    margin-top: 8px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }

  /* TABLES */
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 8.5pt;
  }
  thead tr { background: var(--anthracite); color: white; }
  thead th {
    padding: 8px 10px;
    text-align: left;
    font-weight: 600;
    font-size: 7.5pt;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  tbody tr:nth-child(even) { background: var(--gray-light); }
  tbody tr:nth-child(odd) { background: white; }
  tbody td {
    padding: 7px 10px;
    border-bottom: 1px solid var(--gray-border);
    vertical-align: top;
  }
  td.red-label {
    font-weight: 700;
    color: var(--red);
    white-space: nowrap;
  }

  /* FLOWCHART */
  .flow-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    margin: 14px 0;
  }
  .flow-node {
    background: var(--anthracite);
    color: white;
    padding: 9px 18px;
    text-align: center;
    font-size: 8.5pt;
    font-weight: 600;
    min-width: 200px;
    max-width: 320px;
  }
  .flow-node.red { background: var(--red); }
  .flow-node.light { background: var(--gray-light); color: var(--anthracite); border: 1px solid var(--gray-border); }
  .flow-node.green { background: #2e7d32; }
  .flow-arrow {
    width: 2px;
    height: 16px;
    background: var(--red);
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .flow-arrow::after {
    content: '▼';
    color: var(--red);
    font-size: 8pt;
    position: absolute;
    bottom: -8px;
  }
  .flow-row {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    width: 100%;
    justify-content: center;
  }
  .flow-branch {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    flex: 1;
  }
  .flow-branch-label {
    font-size: 7pt;
    color: var(--red);
    font-weight: 700;
    margin: 3px 0;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .flow-line-h {
    height: 2px;
    background: var(--red);
    width: 100%;
    margin: 8px 0;
  }

  /* DECISION BOX */
  .decision {
    background: var(--red);
    color: white;
    padding: 10px 16px;
    text-align: center;
    font-size: 9pt;
    font-weight: 700;
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    width: 180px;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* DIALOG BOXES */
  .dialog-container { margin: 12px 0; }
  .dialog-bubble {
    padding: 10px 14px;
    margin-bottom: 6px;
    max-width: 85%;
    font-size: 9pt;
    line-height: 1.45;
    font-style: italic;
  }
  .dialog-bubble.kunde {
    background: var(--gray-light);
    border-radius: 0 10px 10px 10px;
    border-left: 3px solid #999;
    align-self: flex-start;
  }
  .dialog-bubble.mitarbeiter {
    background: var(--anthracite);
    color: white;
    border-radius: 10px 0 10px 10px;
    margin-left: auto;
    border-right: 3px solid var(--red);
  }
  .dialog-label {
    font-size: 7pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 3px;
  }
  .dialog-label.k { color: var(--gray-mid); }
  .dialog-label.m { color: var(--red); text-align: right; }
  .dialog-wrap { display: flex; flex-direction: column; }
  .dialog-wrap.m { align-items: flex-end; }

  /* KUNDENTYP CARDS */
  .ktype-card {
    border: 1px solid var(--gray-border);
    margin: 8px 0;
    overflow: hidden;
  }
  .ktype-header {
    background: var(--anthracite);
    color: white;
    padding: 9px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .ktype-badge {
    background: var(--red);
    color: white;
    font-weight: 800;
    font-size: 11pt;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .ktype-name { font-size: 10pt; font-weight: 700; }
  .ktype-desc { font-size: 8pt; color: #bbb; }
  .ktype-body { padding: 10px 14px; }
  .ktype-row { display: flex; gap: 10px; margin-bottom: 6px; }
  .ktype-col { flex: 1; }
  .ktype-col-label { font-size: 7pt; font-weight: 700; color: var(--red); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
  .ktype-col-val { font-size: 8.5pt; color: var(--anthracite); }

  /* CHECKLIST */
  .checklist { list-style: none; padding: 0; margin: 8px 0; }
  .checklist li {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 4px 0; font-size: 9pt;
    border-bottom: 1px solid var(--gray-border);
  }
  .checklist li::before { content: '☐'; color: var(--red); font-size: 11pt; flex-shrink: 0; line-height: 1.2; }

  /* TAGS / BADGES */
  .tag {
    display: inline-block;
    background: var(--red-light);
    color: var(--red-dark);
    border: 1px solid #f0c0c0;
    padding: 2px 8px;
    font-size: 7.5pt;
    font-weight: 600;
    margin: 2px 2px 2px 0;
  }
  .tag.dark {
    background: var(--anthracite);
    color: white;
    border-color: #444;
  }
  .tag.green {
    background: #e8f5e9;
    color: #2e7d32;
    border-color: #a5d6a7;
  }

  /* TWO COLUMN LAYOUT */
  .two-col { display: flex; gap: 14px; margin: 10px 0; }
  .two-col > * { flex: 1; }
  .three-col { display: flex; gap: 10px; margin: 10px 0; }
  .three-col > * { flex: 1; }

  /* STEP PROCESS */
  .steps { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
  .step {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 8px 12px;
    background: var(--gray-light);
    border-left: 3px solid var(--red);
  }
  .step-num {
    min-width: 24px; height: 24px;
    background: var(--red); color: white;
    font-weight: 800; font-size: 9pt;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .step-content { flex: 1; }
  .step-title { font-size: 9pt; font-weight: 700; margin-bottom: 2px; }
  .step-desc { font-size: 8.5pt; color: var(--gray-dark); }

  /* MATRIX TABLE */
  .matrix-table { font-size: 8pt; }
  .matrix-table thead th { font-size: 7.5pt; }
  .matrix-table td { padding: 6px 8px; font-size: 8pt; }

  /* FOOTER */
  .page-footer {
    position: absolute;
    bottom: 12mm;
    left: 16mm;
    right: 16mm;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--gray-border);
    padding-top: 6px;
  }
  .page-footer-left { font-size: 7pt; color: #aaa; }
  .page-footer-right { font-size: 7pt; color: #aaa; }
  .page-footer-center { font-size: 7pt; color: var(--red); font-weight: 600; }

  /* WARNING/TIP BOXES */
  .warn-box {
    background: #fff8e1;
    border-left: 4px solid #f9a825;
    padding: 10px 14px;
    margin: 10px 0;
  }
  .warn-box .box-title { color: #e65100; }
  .tip-box {
    background: #e8f5e9;
    border-left: 4px solid #2e7d32;
    padding: 10px 14px;
    margin: 10px 0;
  }
  .tip-box .box-title { color: #1b5e20; }

  /* NO-GO / DO-BOX */
  .nogo-do { display: flex; gap: 12px; margin: 10px 0; }
  .nogo-box {
    flex: 1;
    background: #fff0f0;
    border: 1px solid #f0c0c0;
    border-top: 3px solid var(--red);
    padding: 10px 12px;
  }
  .do-box {
    flex: 1;
    background: #f0fff4;
    border: 1px solid #a5d6a7;
    border-top: 3px solid #2e7d32;
    padding: 10px 12px;
  }
  .nogo-box .label { color: var(--red); font-weight: 700; font-size: 8pt; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .do-box .label { color: #2e7d32; font-weight: 700; font-size: 8pt; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }

  /* PHASE INDICATOR */
  .phase-bar {
    display: flex;
    margin: 12px 0;
    overflow: hidden;
  }
  .phase-item {
    flex: 1;
    padding: 7px 6px;
    text-align: center;
    font-size: 7.5pt;
    font-weight: 600;
    background: var(--gray-light);
    border-right: 2px solid white;
    color: var(--gray-mid);
  }
  .phase-item.active {
    background: var(--red);
    color: white;
  }
  .phase-item.done {
    background: var(--anthracite);
    color: #aaa;
  }

  /* ICON LABELS */
  .icon-label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 8.5pt;
    font-weight: 600;
  }
  .icon-circle {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--red);
    color: white;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 9pt;
    flex-shrink: 0;
  }

  .status-badge {
    display: inline-block;
    padding: 2px 8px;
    font-size: 7.5pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .status-badge.open { background: #fff3e0; color: #e65100; }
  .status-badge.active { background: var(--red-light); color: var(--red-dark); }
  .status-badge.done { background: #e8f5e9; color: #2e7d32; }
  .status-badge.lost { background: #fce4ec; color: #880e4f; }

  /* HORIZONTAL RULE */
  hr { border: none; border-top: 1px solid var(--gray-border); margin: 14px 0; }
  hr.red { border-top: 2px solid var(--red); }

  /* COMPACT LIST */
  .compact-list { list-style: none; padding: 0; }
  .compact-list li {
    padding: 4px 0 4px 16px;
    position: relative;
    font-size: 9pt;
    border-bottom: 1px solid var(--gray-border);
  }
  .compact-list li::before {
    content: '→';
    position: absolute;
    left: 0;
    color: var(--red);
    font-weight: 700;
  }

  .mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
  .mini-card { background: var(--gray-light); padding: 8px 10px; border-top: 2px solid var(--red); }
  .mini-card .mc-title { font-size: 8pt; font-weight: 700; color: var(--red); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .mini-card .mc-val { font-size: 8.5pt; color: var(--anthracite); }
</style>
</head>
<body>
